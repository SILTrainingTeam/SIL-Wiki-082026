<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>SIL Wiki — Purple Pro Knowledge Base (Public)</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="confidential-banner" class="confidential-banner"></div>

  <div class="topbar">
    <div class="brand">
      <span class="mark">📘 SIL Wiki</span>
      <span class="org" id="org-name"></span>
    </div>
    <div class="search">
      <input id="global-search" type="text" placeholder="Search the wiki… (e.g. PayHinga, SIL Zero, RBP, cancellation)" />
    </div>
    <div class="meta" id="last-published"></div>
  </div>

  <div class="layout">
    <nav class="sidebar" id="sidebar-nav"></nav>
    <main class="content" id="content"></main>
  </div>

  <!-- Chatbot widget -->
  <div id="chat-launcher">
    <div id="chat-label">👋 Ask me anything!</div>
    <button id="chat-toggle" aria-label="Open SIL Wiki assistant">
      <span id="chat-ring"></span>
      💬
      <span id="chat-badge">0</span>
    </button>
  </div>
  <div id="chat-panel">
    <div class="chat-header">
      <div>
        <div class="title">SIL Wiki Assistant</div>
        <div class="subtitle">Answers from the training decks & memos</div>
      </div>
      <button id="chat-close" aria-label="Close chat">✕</button>
    </div>
    <div class="chat-body" id="chat-body"></div>
    <div class="chat-suggestions" id="chat-suggestions"></div>
    <form class="chat-input" id="chat-form">
      <input id="chat-input" type="text" placeholder="Ask a question…" autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>

  <script src="content.js"></script>
  <script src="faqs.js"></script>
  <script src="app.js"></script>
  <script src="chatbot.js"></script>
</body>
</html>
